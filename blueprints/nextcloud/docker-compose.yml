services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - nextcloud-config:/config
      - nextcloud-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:80/status.php
      interval: 30s
      timeout: 10s
      retries: 15
