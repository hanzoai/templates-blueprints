services:
  pihole:
    image: pihole/pihole:latest
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
      - 123:123/udp
    environment:
      - TZ=${TZ:-Europe/London}
      - FTLCONF_webserver_api_password=${SERVICE_PASSWORD_PIHOLE}
      - FTLCONF_dns_listeningMode=${FTLCONF_dns_listeningMode:-all}
    volumes:
      - pihole-data:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_TIME
