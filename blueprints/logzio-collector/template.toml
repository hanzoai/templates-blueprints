[variables]
main_domain = "${domain}"
version = "0.4.0"
token = ""
matchcontainername = "no-container-match-hence-no-logs"

[config]

[[config.domains]]
serviceName = "logzio-collector"
port = 80
host = "${main_domain}"

[config.env]
VERSION = "${version}"
TOKEN = "${token}"
MATCHCONTAINERNAME = "${matchcontainername}"
