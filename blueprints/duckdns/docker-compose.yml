services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBDOMAINS=subdomain1,subdomain2
      - TOKEN=token
      - UPDATE_IP=ipv6
      - LOG_FILE=false
    volumes:
      - duckdns-config:/config
    restart: unless-stopped
volumes:
  duckdns-config: {}
