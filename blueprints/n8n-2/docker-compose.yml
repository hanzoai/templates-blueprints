services:
  n8n-2:
    image: n8nio/n8n:2.32.3
    environment:
      N8N_EDITOR_BASE_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-2-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_NR_DB_PASSWORD}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    depends_on:
      n8n-2-db:
        condition: service_healthy
    volumes:
      - n8n-2-n8n:/home/node/.n8n
    expose:
      - "5678"
    restart: always
  n8n-2-db:
    image: postgres:18
    environment:
      POSTGRES_USER: tipi
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
      POSTGRES_NON_ROOT_USER: n8n
      POSTGRES_NON_ROOT_PASSWORD: ${N8N_NR_DB_PASSWORD}
    volumes:
      - n8n-2-postgresql:/var/lib/postgresql
      - n8n-2-init-data-sh:/docker-entrypoint-initdb.d/init-data.sh
    restart: always
volumes:
  n8n-2-n8n: {}
  n8n-2-postgresql: {}
  n8n-2-init-data-sh: {}
