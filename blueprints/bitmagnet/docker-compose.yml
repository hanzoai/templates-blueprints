services:
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.0
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler
    environment:
      POSTGRES_HOST: bitmagnet-db
      POSTGRES_NAME: bitmagnet
      POSTGRES_USER: tipi
      POSTGRES_PASSWORD: ${BITMAGNENT_DB_PASSWORD}
      REDIS_ADDR: bitmagnet-redis:6379
    depends_on:
      bitmagnet-db:
        condition: service_healthy
      bitmagnet-redis:
        condition: service_started
    expose:
      - "3333"
    restart: always
  bitmagnet-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${BITMAGNENT_DB_PASSWORD}
      POSTGRES_USER: tipi
      POSTGRES_DB: bitmagnet
    volumes:
      - bitmagnet-data:/var/lib/postgresql/data
    restart: always
  bitmagnet-redis:
    image: redis:alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - bitmagnet-data:/data
    restart: always
volumes:
  bitmagnet-data: {}
