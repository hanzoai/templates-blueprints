[variables]
main_domain = "${domain}"
version = "1-ef5ffcb"
upstream-http-address = ""
max-body-size = "256M"

[config]

[[config.domains]]
serviceName = "nginx-reverse-proxy"
port = 80
host = "${main_domain}"

[config.env]
VERSION = "${version}"
UPSTREAM_HTTP_ADDRESS = "${upstream-http-address}"
MAX_BODY_SIZE = "${max-body-size}"
