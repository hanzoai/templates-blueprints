services:
  n8n-io-db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n-io-db:/var/lib/postgresql/data
    restart: always
  n8n-io:
    image: n8nio/n8n:${N8N_VERSION}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-io-db
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE}
      TZ: ${N8N_TIMEZONE}
      NODE_ENV: ${N8N_ENVIRONMENT}
      N8N_PROTOCOL: https
      N8N_HOST: n8n-io.${ROOT_DOMAIN}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED}
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${N8N_SMTP_HOST}
      N8N_SMTP_PORT: ${N8N_SMTP_PORT}
      N8N_SMTP_USER: ${N8N_SMTP_USER}
      N8N_SMTP_PASS: ${N8N_SMTP_PASS}
      N8N_SMTP_SENDER: ${N8N_SMTP_SENDER}
      N8N_SMTP_SSL: ${N8N_SMTP_SSL}
      WEBHOOK_URL: https://n8n-io.${ROOT_DOMAIN}
      N8N_EDITOR_BASE_URL: https://n8n-io.${ROOT_DOMAIN}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n-io:/home/node/.n8n
      - n8n-io-files:/files
    depends_on:
      - n8n-io-db
    expose:
      - "5678"
    restart: always
volumes:
  n8n-io-db: {}
  n8n-io: {}
  n8n-io-files: {}
