[variables]
main_domain = "${domain}"
vsts-version = "ubuntu-16.04-standard"
vsts-account = ""
vsts-token = ""
vsts-name = ""
vsts-pool = ""

[config]

[[config.domains]]
serviceName = "vsts"
port = 80
host = "${main_domain}"

[config.env]
VSTS_VERSION = "${vsts-version}"
VSTS_ACCOUNT = "${vsts-account}"
VSTS_TOKEN = "${vsts-token}"
VSTS_NAME = "${vsts-name}"
VSTS_POOL = "${vsts-pool}"
