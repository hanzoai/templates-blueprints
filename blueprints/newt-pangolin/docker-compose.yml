services:
  newt:
    image: fosrl/newt:latest
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT:-https://pangolin.domain.tld}
      - NEWT_ID=${NEWT_ID:?}
      - NEWT_SECRET=${NEWT_SECRET:?}
    healthcheck:
      test:
        - CMD
        - newt
        - --version
      interval: 5s
      timeout: 20s
      retries: 10
