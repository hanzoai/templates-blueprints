services:
  halo:
    image: halohub/halo:2.25.4
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo
      - --spring.r2dbc.username=halo
      - --spring.r2dbc.password=${HALO_DATABASE_PASSWORD}
      - --spring.sql.init.platform=postgresql
      - --halo.external-url=${HALO_EXTERNAL_URL}
    depends_on:
      halodb:
        condition: service_healthy
    volumes:
      - halo-halo2:/root/.halo2
    expose:
      - "8090"
    restart: always
  halodb:
    image: postgres:15.4
    environment:
      POSTGRES_PASSWORD: ${HALO_DATABASE_PASSWORD}
      POSTGRES_USER: halo
      POSTGRES_DB: halo
      PGUSER: halo
    volumes:
      - halo-data:/var/lib/postgresql/data
    restart: always
volumes:
  halo-halo2: {}
  halo-data: {}
