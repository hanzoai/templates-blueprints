services:
  authentik-1:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: server
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
    depends_on:
      - authentik-db
    expose:
      - "9443"
    volumes:
      - authentik-1-media:/media
      - authentik-1-templates:/templates
    restart: always
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: worker
    user: root
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
    depends_on:
      - authentik-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-1-media:/media
      - authentik-1-certs:/certs
      - authentik-1-templates:/templates
    restart: always
  authentik-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - POSTGRES_USER=authentik
      - POSTGRES_DB=authentik
    volumes:
      - authentik-1-postgresql:/var/lib/postgresql
    restart: always
volumes:
  authentik-1-media: {}
  authentik-1-templates: {}
  authentik-1-certs: {}
  authentik-1-postgresql: {}
