services:
  valheim:
    image: lloesche/valheim-server:${VERSION}
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SERVER_PORT: "2456"
      WORLD_NAME: ${WORLD_NAME}
      SERVER_PASS: ${SERVER_PASS}
      SERVER_PUBLIC: "true"
      TZ: ${TIMEZONE}
      UPDATE_CRON: 0 * * * *
      UPDATE_IF_IDLE: "true"
      BACKUPS_CRON: 0 */6 * * *
      BACKUPS_MAX_AGE: "3"
    volumes:
      - valheim-config:/config
      - valheim-data:/opt/valheim
    cap_add:
      - SYS_NICE
    ports:
      - 2456:2456
      - 2457:2457
      - 2458:2458
    restart: always
volumes:
  valheim-config: {}
  valheim-data: {}
