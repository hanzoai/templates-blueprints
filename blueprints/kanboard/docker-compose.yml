services:
  kanboard:
    image: kanboard/kanboard:v1.2.52
    environment:
      PLUGIN_INSTALLER: ${PLUGIN_INSTALLER}
    volumes:
      - kanboard-data:/var/www/app/data
      - kanboard-plugins:/var/www/app/plugins
    expose:
      - "80"
    restart: always
volumes:
  kanboard-data: {}
  kanboard-plugins: {}
