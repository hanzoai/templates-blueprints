[variables]
main_domain = "${domain}"

[config]

[[config.domains]]
serviceName = "osticket"
port = 80
host = "${main_domain}"

[config.env]
SERVICE_URL_OSTICKET = "https://${main_domain}"
SERVICE_USER_MARIADB = "${username}"
SERVICE_PASSWORD_MARIADB = "${password:32}"
SERVICE_PASSWORD_OSTICKETSECRET = "${password:32}"
SERVICE_USER_OSTICKETADMIN = "${username}"
SERVICE_PASSWORD_OSTICKETADMINPASS = "${password:32}"
SERVICE_PASSWORD_MARIADBROOT = "${password:32}"
