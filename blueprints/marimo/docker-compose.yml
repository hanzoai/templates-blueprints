services:
  marimo:
    image: ghcr.io/marimo-team/marimo:latest-sql
    environment:
      - TOKEN_PASSWORD=$SERVICE_PASSWORD_MARIMO
    volumes:
      - marimo:/app
    command:
      - marimo
      - edit
      - --token-password
      - ${SERVICE_PASSWORD_MARIMO}
      - --port
      - "8080"
      - --host
      - 0.0.0.0
    healthcheck:
      test:
        - CMD
        - uvx
        - --with
        - httpx[cli]
        - httpx
        - http://localhost:8080/health
      interval: 5s
      timeout: 5s
      retries: 3
