services:
  mstream:
    image: lscr.io/linuxserver/mstream:v5.12.2-ls190
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - mstream-data:/data
      - mstream-music:/music
    expose:
      - "3000"
    restart: always
volumes:
  mstream-data: {}
  mstream-music: {}
