[variables]
main_domain = "${domain}"
version = "3.13.7"
port-voice = "9987"
port-files = "30033"
port-query = "10011"

[config]

[[config.domains]]
serviceName = "teamspeak"
port = 80
host = "${main_domain}"

[config.env]
VERSION = "${version}"
PORT_VOICE = "${port-voice}"
PORT_FILES = "${port-files}"
PORT_QUERY = "${port-query}"
