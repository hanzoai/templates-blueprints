services:
  notemark:
    image: ghcr.io/enchant97/note-mark-frontend:0.19.3
    restart: always
  notemark-backend:
    image: ghcr.io/enchant97/note-mark-backend:0.19.5
    environment:
      JWT_SECRET: ${NOTEMARK_SERVICE_SECRET}
      CORS_ORIGINS: "*"
    volumes:
      - notemark-data:/data
    restart: always
  notemark-proxy:
    image: nginx:alpine
    volumes:
      - notemark-default-conf:/etc/nginx/conf.d/default.conf
    expose:
      - "80"
    restart: always
volumes:
  notemark-data: {}
  notemark-default-conf: {}
