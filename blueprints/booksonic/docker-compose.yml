services:
  booksonic:
    image: lscr.io/linuxserver/booksonic-air:2201.1.0
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      CONTEXT_PATH: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
    volumes:
      - booksonic-config:/config
      - booksonic-audiobooks:/audiobooks
      - booksonic-podcasts:/podcasts
    expose:
      - "4040"
    restart: always
volumes:
  booksonic-config: {}
  booksonic-audiobooks: {}
  booksonic-podcasts: {}
