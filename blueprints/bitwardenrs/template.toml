[variables]
main_domain = "${domain}"
bitwardenrs-version = "1.30.1"
register-enabled = "true"
admin-token = ""

[config]

[[config.domains]]
serviceName = "bitwardenrs"
port = 80
host = "${main_domain}"

[config.env]
BITWARDENRS_VERSION = "${bitwardenrs-version}"
REGISTER_ENABLED = "${register-enabled}"
ADMIN_TOKEN = "${admin-token}"
ROOT_DOMAIN = "${main_domain}"
