[variables]
main_domain = "${domain}"

[config]

[[config.domains]]
serviceName = "codimd"
port = 3000
host = "${main_domain}"

[config.env]
SERVICE_FQDN_CODIMD = "${main_domain}"
SERVICE_PASSWORD_SESSIONSECRET = "${password:32}"
SERVICE_USER_POSTGRES = "${username}"
SERVICE_PASSWORD_POSTGRES = "${password:32}"
