[variables]
main_domain = "${domain}"
splitpro-version = "v1.5.8"
postgres-password = "${password:16}"
nextauth-secret = "${password:32}"
google-client-id = ""
google-client-secret = ""

[config]

[[config.domains]]
serviceName = "splitpro"
port = 3000
host = "${main_domain}"

[config.env]
SPLITPRO_VERSION = "${splitpro-version}"
POSTGRES_PASSWORD = "${postgres-password}"
NEXTAUTH_SECRET = "${nextauth-secret}"
GOOGLE_CLIENT_ID = "${google-client-id}"
GOOGLE_CLIENT_SECRET = "${google-client-secret}"
ROOT_DOMAIN = "${main_domain}"
