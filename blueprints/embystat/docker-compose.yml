services:
  embystat:
    image: lscr.io/linuxserver/embystat:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - embystat-config:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:6555
      interval: 2s
      timeout: 10s
      retries: 15
