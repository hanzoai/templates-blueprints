services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - extra/healthcheck
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    environment:
      - MYSQL_USER=${SERVICE_USER_MARIADB}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
      - mariadb-data:/var/lib/mysql
